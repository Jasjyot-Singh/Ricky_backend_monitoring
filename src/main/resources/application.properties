spring.application.name=Ricky_backend_monitoring

# ----------------------------------------------------
# OPTION A: MySQL Database (Local or Cloud Server)
# ----------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ricky_monitoring?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------
# OPTION B: Local H2 In-Memory DB (Alternative offline option)
# ----------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:rickydb;DB_CLOSE_DELAY=-1
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security Config (Default Pilot Device Token)
ricky.device.token=${RICKY_DEVICE_TOKEN:RICKY_PILOT_DEVICE_TOKEN_SECRET_2026}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.Ricky_backend_monitoring=INFO

# Server Config
server.port=${PORT:8080}
server.servlet.context-path=
